<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#6366f1"/>

  <!-- Building body -->
  <rect x="56" y="90" width="144" height="120" rx="4" fill="#ffffff"/>

  <!-- Roof / pediment -->
  <polygon points="128,48 44,94 212,94" fill="#4f46e5"/>

  <!-- Windows row 1 -->
  <rect x="78"  y="108" width="24" height="20" rx="2" fill="#6366f1"/>
  <rect x="116" y="108" width="24" height="20" rx="2" fill="#6366f1"/>
  <rect x="154" y="108" width="24" height="20" rx="2" fill="#6366f1"/>

  <!-- Windows row 2 -->
  <rect x="78"  y="140" width="24" height="20" rx="2" fill="#6366f1"/>
  <rect x="116" y="140" width="24" height="20" rx="2" fill="#6366f1"/>
  <rect x="154" y="140" width="24" height="20" rx="2" fill="#6366f1"/>

  <!-- Door -->
  <rect x="108" y="168" width="40" height="42" rx="3" fill="#4f46e5"/>
  <!-- Door knob -->
  <circle cx="142" cy="190" r="3" fill="#a5b4fc"/>

  <!-- Flag pole -->
  <line x1="128" y1="48" x2="128" y2="20" stroke="#e0e7ff" stroke-width="3"/>
  <!-- Flag -->
  <polygon points="128,20 152,28 128,36" fill="#a5b4fc"/>
</svg>
